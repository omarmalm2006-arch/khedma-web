
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khedma - خدماتك بسهولة</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/search.css">
</head>
<body>

    <header>
        <nav class="navbar">
            <div class="nav-right">
                <a href="index.html" class="logo">
                    <span class="logo-icon">
                        <img src="assests/icons/logo.svg" alt="logo">
                    </span>
                    <div class="logo-text">
                        <span class="brand-name">خدمة</span>
                        <span class="brand-tagline">كل بيت يستاهل حد أمين</span>
                    </div>
                </a>
            </div>

            <ul class="nav-links">
                <li><a href="index.html"><i class="fa-solid fa-house"></i> الرئيسية</a></li>
                <li><a href="search.html" class="active"><i class="fa-solid fa-magnifying-glass"></i> ابحث عن فني</a></li>
                <li><a href="#"><i class="fa-regular fa-heart"></i> المفضلة</a></li>
            </ul>

            <div class="nav-left">
                <div class="user-role-toggle">
                    <span class="role-btn active">عميل</span>
                    <span class="role-btn">مقدم خدمة</span>
                    <span class="role-btn">إدارة</span>
                </div>

                <a href="#" class="icon-btn">
                    <i class="fa-regular fa-bell"></i>
                </a>

                <a href="#" class="login-button">
                    <i class="fa-regular fa-user"></i> دخول
                </a>
            </div>
        </nav>
    </header>

    <main class="search-page-container">

        <div class="search-header-title">
            <p class="breadcrumb">الرئيسية / البحث</p>
            <h1>ابحث عن فني</h1>
            <p class="subtitle">اختار الخدمة واحنا نوصلك بأحسن ناس</p>
        </div>

        <div class="search-layout">

            <aside class="filters-sidebar">

                <div class="filter-header">
                    <h3><i class="fa-solid fa-sliders"></i> الفلاتر</h3>
                    <button type="button" id="reset-filters" class="reset-btn">
                        إعادة الضبط
                    </button>
                </div>

                <div class="filter-group">
                    <div class="search-input-wrapper">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input
                            type="text"
                            id="search-keyword"
                            placeholder="ابحث بالاسم أو الخدمة"
                        >
                    </div>
                </div>

                <div class="filter-group">
                    <label for="job-select">نوع الخدمة</label>
                    <select id="job-select">
                        <option value="all">كل الخدمات</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="location-select">المكان</label>
                    <select id="location-select">
                        <option value="all">كل المحافظات</option>
                    </select>
                </div>

                <button type="button" id="apply-filters-btn" class="apply-btn">
                    عرض النتائج
                </button>

            </aside>

            <section class="results-section">

                <div class="results-header">
                    <span class="results-count">
                        <strong id="count-number">0</strong>
                        فنيين متاحين لخدمتك
                    </span>

                    <div class="sort-wrapper">
                        <select id="sort-select">
                            <option value="newest">الأحدث</option>
                            <option value="price_low">الأقل سعرًا</option>
                            <option value="price_high">الأعلى سعرًا</option>
                        </select>
                    </div>
                </div>

                <div class="workers-list-grid" id="workers-list">
                    <p id="workers-message">جاري تحميل الفنيين...</p>
                </div>

            </section>

        </div>
    </main>

    <script src="js/search.js"></script>

</body>
</html>
