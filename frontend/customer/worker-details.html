
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>خدمة | تفاصيل الفني</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <link rel="stylesheet" href="css/workers-details.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <nav class="navbar">

            <div class="nav-right">
                <a href="index.html" class="logo">
                    <span class="logo-icon">
                        <img src="assests/icons/logo.svg" alt="logo">
                    </span>

                    <div class="logo-text">
                        <span class="brand-name">خدمة</span>
                        <span class="brand-tagline">كل بيت يستاهل حد أمين</span>
                    </div>
                </a>
            </div>

            <ul class="nav-links">
                <li>
                    <a href="index.html">
                        <i class="fa-solid fa-house"></i>
                        الرئيسية
                    </a>
                </li>

                <li>
                    <a href="search.html">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        ابحث عن فني
                    </a>
                </li>
            </ul>

            <div class="nav-left">
                <div class="user-role-toggle">
                    <span class="role-btn active">عميل</span>
                    <span class="role-btn">مقدم خدمة</span>
                    <span class="role-btn">إدارة</span>
                </div>

                <a href="#" class="icon-btn">
                    <i class="fa-regular fa-bell"></i>
                </a>

                <a href="../pages/login.html" class="login-button">
                    <i class="fa-regular fa-user"></i>
                    دخول
                </a>
            </div>

        </nav>
    </header>


    <main class="worker-details-container">

        <!-- Breadcrumb -->
        <div class="breadcrumb">
            <a href="index.html">الرئيسية</a> /
            <a href="search.html">البحث</a> /
            <span id="breadcrumb-name">تفاصيل الفني</span>
        </div>


        <!-- Worker Information -->
        <section class="worker-hero-card">

            <div class="worker-hero-info">

                <div class="worker-avatar">
                    <img
                        id="worker-img"
                        src="assests/images/كهربائي.jpeg"
                        alt="صورة الفني">

                    <span class="online-indicator"></span>
                </div>


                <div class="worker-meta">

                    <div class="worker-title-badge">
                        <h1 id="worker-name">جاري تحميل البيانات...</h1>

                        <span class="verified-tag">
                            <i class="fa-solid fa-circle-check"></i>
                            موثوق
                        </span>
                    </div>


                    <p id="worker-job" class="worker-specialty">
                        -
                    </p>


                    <p class="worker-location">
                        <i class="fa-solid fa-location-dot"></i>
                        <span id="worker-location">-</span>
                    </p>


                    <div class="worker-stats-row">

                        <span>
                            <i class="fa-solid fa-briefcase"></i>
                            <strong id="worker-experience">-</strong>
                        </span>

                    </div>

                </div>

            </div>


            <!-- Price and Contact -->
            <div class="worker-booking-box">

                <div class="price-header">
                    <span class="price-label">السعر المبدئي</span>

                    <span id="worker-price" class="price-amount">
                        -
                    </span>
                </div>


                <div class="phone-box">
                    <span class="price-label">رقم الهاتف</span>

                    <strong id="worker-phone">
                        -
                    </strong>
                </div>

            </div>

        </section>


        <!-- Worker Description -->
        <div class="details-content-grid">

            <div class="details-main-column">

                <section class="details-card">

                    <h2>
                        <i class="fa-solid fa-user-gear"></i>
                        نبذة عن الفني
                    </h2>

                    <p id="worker-bio">
                        جاري تحميل بيانات الفني...
                    </p>

                </section>

            </div>

        </div>

    </main>


    <script src="js/worker-details.js"></script>

</body>
</html>
